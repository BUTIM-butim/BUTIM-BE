spring:
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

external:
  # 산재보험 요양 신청/승인 데이터 API
  industrial-accident:
    base-url: https://apis.data.go.kr/B490001/SJBoheomYoyang
    service-key: ${SERVICE_KEY}
    page-no: 1
    num-of-rows: 10000
    industry-path: /OPA001MT_12_INFO
    job-path: /OPA252MT_14_INFO

  # 산재 판례 정보 API
  precedent:
    base-url: https://apis.data.go.kr/B490001/sjbPrecedentInfoService
    service-key: ${SERVICE_KEY}
    page-no: 1
    num-of-rows: 10
    count-path: /getSjbYuhyeongByCountPstate
    content-path: /getSjbPrecedentNaeyongPstate

  # 산재 승인 기간 예측용 API
  prediction-data:
    base-url: https://apis.data.go.kr/B490001/SJBoheomYoyang
    service-key: ${SERVICE_KEY}
    page-no: 1
    num-of-rows: 10000
    industry-apply-path: /OPA001MT_12_INFO
    industry-approval-path: /OPA001MT_22_INFO
    job-apply-path: /OPA252MT_14_INFO
    job-approval-path: /OPA252MT_24_INFO
    business-size-apply-path: /OPA001MT_11_INFO
    business-size-approval-path: /OPA001MT_21_INFO
    age-apply-path: /OPA252MT_11_INFO
    age-approval-path: /OPA252MT_21_INFO
    accident-type-approval-path: /OPA020MT_22_INFO
    diagnosis-apply-path: /OPA020MT_11_INFO
    diagnosis-approval-path: /OPA020MT_21_INFO

  # 한국사회보장정보원_중앙부처복지서비스 API
  central-welfare:
    base-url: https://apis.data.go.kr/B554287/NationalWelfareInformationsV001
    service-key: ${SERVICE_KEY}
    page-no: 1
    num-of-rows: 100
    list-path: /NationalWelfarelistV001  # 목록 조회
    detail-path: /NationalWelfaredetailedV001  # 상세 조회

  # 한국사회보장정보원_지자체복지서비스 API
  local-welfare:
    base-url: https://apis.data.go.kr/B554287/LocalGovernmentWelfareInformations
    service-key: ${SERVICE_KEY}
    page-no: 1
    num-of-rows: 100
    list-path: /LcgvWelfarelist # 목록 조회
    detail-path: /LcgvWelfaredetailed  # 상세 조회

  # 서민금융진흥원_대출상품한눈에 정보 서비스 API
  micro-finance:
    base-url: https://apis.data.go.kr/B553701/LoanProductSearchingInfo
    service-key: ${SERVICE_KEY}
    page-no: 1
    num-of-rows: 20
    list-path: /LoanProductSearchingInfo/getLoanProductSearchingInfo

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  base-url: https://api.openai.com/v1
  chat-completions-path: /chat/completions